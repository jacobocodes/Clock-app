<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-height: 100vh;
      background: #0e0e10;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #clock {
      font-size: clamp(2.5rem, 14vw, 9rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #clock .ampm {
      font-size: 0.35em;
      font-weight: 400;
      margin-left: 0.4em;
      vertical-align: baseline;
      opacity: 0.7;
    }
    #timezone {
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div id="clock" aria-live="off">--:--:--</div>
  <div id="timezone"></div>

  <script>
    (function () {
      var clockEl = document.getElementById("clock");
      var tzEl = document.getElementById("timezone");

      // Show the user's resolved timezone (e.g. "America/Mexico_City").
      try {
        tzEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      } catch (e) {
        tzEl.textContent = "";
      }

      function render() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var s = now.getSeconds();
        var ampm = h >= 12 ? "PM" : "AM";

        h = h % 12;
        if (h === 0) h = 12;

        var time =
          h +
          ":" +
          String(m).padStart(2, "0") +
          ":" +
          String(s).padStart(2, "0");

        clockEl.innerHTML = time + '<span class="ampm">' + ampm + "</span>";
      }

      function tick() {
        render();
        // Re-align to the next second boundary so updates stay accurate.
        var delay = 1000 - (Date.now() % 1000);
        setTimeout(tick, delay);
      }

      tick();
    })();
  </script>
</body>
</html>
